name: Trigger docs deploy

# the docs site is a static build that bakes in the bridge source at build time
# so it must be rebuilt whenever main changes or a new release is published
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# one deploy at a time, newer pushes supersede an in-flight one
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Trigger Coolify deploy
        # the deploy hook url and api token are stored as repo secrets
        # coolify rebuilds the docs image without cache, so it always refetches
        # the bridge source instead of reusing a cached copy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: sh scripts/coolify-deploy.sh "${{ secrets.COOLIFY_DOCS_DEPLOY_HOOK }}"
