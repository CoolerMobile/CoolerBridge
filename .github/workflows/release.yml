name: Release

# triggered manually, usually through "bun run release"
on:
  workflow_dispatch:

# allow the job to push the version commit, the tag, the release and the image
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # ephemeral database the test harness connects to, dropped with the runner
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coolerbridge
          POSTGRES_USER: coolerbridge
          POSTGRES_PASSWORD: coolerbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coolerbridge -d coolerbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history and tags are needed to diff commits since the last release
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate development keys
        # tests run in development mode and verify assertions against dev/keys,
        # which are gitignored, so they are generated fresh for the run
        run: bun gen:keys

      - name: Run tests
        run: bun test
        env:
          DATABASE_URL: postgres://coolerbridge:coolerbridge@localhost:5432/coolerbridge

      - name: Compute version and notes
        id: version
        run: bun scripts/release.ts

      - name: Commit and tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): ${{ steps.version.outputs.tag }}"
          # annotated tag so "git push --follow-tags" actually sends it
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}" --follow-tags

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes

      - name: Trigger docs deploy
        # this job's commit and release are made with the default GITHUB_TOKEN,
        # whose events do not trigger other workflows, so the docs deploy that
        # publishes the new version is kicked off from here, after the release
        run: |
          curl --fail --silent --show-error \
            --request POST "${{ secrets.COOLIFY_DOCS_DEPLOY_HOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
