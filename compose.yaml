services:
  bridge:
    image: ghcr.io/coolermobile/coolerbridge:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coolerbridge
      POSTGRES_USER: coolerbridge
      POSTGRES_PASSWORD: coolerbridge
    volumes:
      - coolerbridge-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolerbridge -d coolerbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  coolerbridge-postgres:
