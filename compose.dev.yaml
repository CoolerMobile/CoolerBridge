services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: coolerbridge
      POSTGRES_USER: coolerbridge
      POSTGRES_PASSWORD: coolerbridge
    ports:
      - "5432:5432"
    volumes:
      - coolerbridge-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolerbridge -d coolerbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  coolerbridge-postgres:
